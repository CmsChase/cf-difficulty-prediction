name: Prospective commitment witness

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  verify-commitment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the witnessed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install frozen project dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify model freeze when artifacts exist
        env:
          PYTHONPATH: src
        run: |
          if [[ -e prospective/model_bundle_v2.json || -e prospective/model_freeze_manifest_v2.json ]]; then
            test -f prospective/model_bundle_v2.json
            test -f prospective/model_freeze_manifest_v2.json
            python -m cf_diff.prospective_model verify \
              --protocol configs/prospective_protocol_v2.json \
              --model prospective/model_bundle_v2.json \
              --manifest prospective/model_freeze_manifest_v2.json
          fi

      - name: Verify prospective event chains
        env:
          PYTHONPATH: src
        run: python -m cf_diff.prospective_ledger verify

      - name: Enforce append-only public evidence
        if: ${{ github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          PYTHONPATH: src
          WITNESS_BASE: ${{ github.event.before }}
        run: >-
          python -m cf_diff.prospective_ledger check-append-only
          --base-ref "$WITNESS_BASE"
