name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Verify prospective ledger hash chains
        run: PYTHONPATH=src python -m cf_diff.prospective_ledger verify

      - name: Enforce append-only prospective ledgers
        if: github.event_name == 'pull_request'
        run: PYTHONPATH=src python -m cf_diff.prospective_ledger check-append-only --base-ref "origin/${{ github.base_ref }}"
